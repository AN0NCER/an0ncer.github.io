<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <meta name="page" content="404">
    <title>Tunime - 404</title>
    <link rel="icon" type="image/png" href="/images/icon-web.png" />
    <link rel="preload" as="style" href="/pages/404/styles/css/404.css">
    <link rel="stylesheet" href="/pages/404/styles/css/404.css">
    <link rel="preload" href="/style/fonts/Manrope.ttf" as="font" type="font/ttf" crossorigin></head>

<body>
    <!-- Настроечная таблица -->
    <div class="bars" aria-hidden="true">
        <div>
            <i style="background:#c9ced6"></i><i style="background:#FFD700"></i><i style="background:#4fd1c5"></i><i
                style="background:#4fd18f"></i><i style="background:#c77dff"></i><i style="background:#ff8a80"></i><i
                style="background:#2393F1"></i>
        </div>
        <div>
            <i style="background:#2393F1"></i><i style="background:#101318"></i><i style="background:#ff8a80"></i><i
                style="background:#101318"></i><i style="background:#4fd1c5"></i><i style="background:#101318"></i><i
                style="background:#c9ced6"></i>
        </div>
        <div class="r3">
            <i style="background:#0b2a4a"></i><i style="background:#f2f4f7"></i><i style="background:#2a1a4a"></i><i
                style="background:#101318"></i><i style="background:#07090c"></i><i style="background:#191C21"></i><i
                style="background:#22262C"></i>
        </div>
    </div>
    <canvas class="noise" width="96" height="54" aria-hidden="true"></canvas>
    <div class="scan" aria-hidden="true"></div>
    <div class="roll" aria-hidden="true"></div>

    <main class="stage">
        <div class="card">
            <div class="sign" aria-hidden="true"><canvas class="mascot"></canvas></div>
            <div class="text">
                <span class="pill"><i></i><span id="pill"></span></span>
                <h1 id="title" role="status"></h1>
                <span class="sub" id="sub"></span>
                <a class="home" href="/">На главную</a>
            </div>
        </div>
    </main>

    <div class="ticker" aria-hidden="true">
        <div class="tk" id="tk"></div>
    </div>

    <script src="/pages/404/404.js" type="module"></script>
</body>

</html>
