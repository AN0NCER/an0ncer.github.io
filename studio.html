<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="page" content="studio">
    <title>Tunime - Студия озвучки</title>
    <link rel="icon" type="image/png" href="/images/icon-web.png" />
    <link rel="preload" as="style" href="/style/css/main.css">
    <link rel="preload" as="style" href="/pages/studio/styles/css/studio.css">
    <link rel="stylesheet" href="/style/css/main.css">
    <link rel="stylesheet" href="/pages/studio/styles/css/studio.css">
    <link rel="stylesheet" href="/style/menu/css/menu.core.css">
    <link rel="stylesheet" href="/style/css/ticons.css">
    <link rel="manifest" href="/images/icons/manifest-o.json">
    <link rel="preload" href="/style/fonts/Manrope.ttf" as="font" type="font/woff2" crossorigin>
</head>

<body class="unselectable" data-page="studio" angle="0">
    <div class="body-wrapper">
        <header>
            <div class="page-controll-wrapper">
                <div class="btn back-btn" role="button" tabindex="0" aria-label="Назад">
                    <svg class="icon" viewBox="0 0 640 640" aria-hidden="true">
                        <use href="#i-angle-left"></use>
                    </svg>
                </div>
                <span class="page-title-wrapper">
                    <span class="page">Студия озвучки</span>
                    <span class="sub head-sub">Загрузка…</span>
                </span>
                <div class="btn share-btn" role="button" tabindex="0" aria-label="Поделиться ссылкой" title="Поделиться">
                    <svg class="icon stroke" viewBox="0 0 24 24" aria-hidden="true">
                        <use href="#i-link"></use>
                    </svg>
                </div>
            </div>
        </header>

        <!--
            На ПК: слева липкий профиль студии, справа состояния, новые серии и все тайтлы.
            На телефоне обе колонки «растворяются» (display: contents), и блоки
            встают одной лентой в порядке data-o (см. _layout.scss).
        -->
        <div class="studio-layout">
            <aside class="profile scroll-none">
                <section class="s-card hero" data-o="1"></section>
                <section class="kpis" data-o="2" aria-label="Цифры студии"></section>
                <section class="s-card branches" data-o="4" hidden></section>
                <section class="s-card genres" data-o="8" hidden></section>
                <section class="s-card years" data-o="9" hidden></section>
                <section class="s-card kinds" data-o="10" hidden></section>
            </aside>

            <main class="studio-main">
                <section class="s-card states" data-o="3"></section>
                <section class="fresh" data-o="5" hidden>
                    <div class="s-head">
                        <span class="s-title">Свежие серии</span>
                        <span class="sub">недавно вышли в озвучке студии</span>
                    </div>
                    <div class="fresh-rail scroll-none"></div>
                </section>
                <section class="titles" data-o="6" id="titles">
                    <div class="s-head">
                        <span class="s-title">Все тайтлы</span>
                        <span class="sub titles-count"></span>
                    </div>
                    <div class="titles-controls">
                        <div class="titles-search-row">
                            <div class="page-search-wrapper titles-search">
                                <div class="icon-wrapper">
                                    <svg class="icon" viewBox="0 0 10 10" aria-hidden="true">
                                        <use href="#i-ios-search"></use>
                                    </svg>
                                </div>
                                <input type="search" id="title-search" placeholder="Найти аниме в озвучке" autocomplete="off" enterkeyhint="search">
                            </div>
                            <button type="button" class="genres-btn" aria-haspopup="dialog" aria-label="Жанры и темы" title="Жанры и темы">
                                <svg class="icon stroke" viewBox="0 0 24 24" aria-hidden="true">
                                    <path d="M4 7h10M18 7h2M4 17h4M12 17h8M16 5v4M10 15v4"></path>
                                </svg>
                                <span class="genres-count" hidden></span>
                            </button>
                        </div>
                        <div class="chips-row title-filters" role="group" aria-label="Состояние"></div>
                        <div class="chips-row title-sorts" role="group" aria-label="Сортировка"></div>
                    </div>
                    <div class="title-grid" aria-live="polite"></div>
                    <div class="title-grid-sentinel"></div>
                </section>
                <section class="s-card top" data-o="7" hidden></section>
            </main>
        </div>
    </div>
    <div id="app-menu-host"></div>

    <!-- Окно «Жанры и темы»: содержимое собирает pages/studio/windows/win.genres.js -->
    <span class="windowed window-genres unselectable hide">
        <span class="hide-window"></span>
        <span class="window-content scroll-none hide">
            <span class="content-wrapper">
                <div class="window-bar">
                    <div class="window-title">Жанры и темы</div>
                    <!-- ПК: поиск, легенда и действия — в шапке окна.
                         На телефоне скрыты: там поиск и кнопки в нижней панели -->
                    <label class="genres-desk-search desk-only">
                        <svg class="icon" viewBox="0 0 10 10" aria-hidden="true">
                            <use href="#i-ios-search"></use>
                        </svg>
                        <input type="search" class="genres-desk-input" placeholder="Найти жанр" autocomplete="off" aria-label="Найти жанр">
                    </label>
                    <span class="genres-desk-legend desk-only"><b class="in">+</b> есть <b class="out">−</b> нет</span>
                    <button type="button" class="desk-btn genres-reset -desk desk-only">Сбросить</button>
                    <button type="button" class="desk-btn -primary genres-apply desk-only">Готово</button>
                    <div class="win-bar-btn window-close" role="button" tabindex="0" aria-label="Закрыть">
                        <svg class="icon" viewBox="0 0 640 640" aria-hidden="true">
                            <use href="#i-xmark"></use>
                        </svg>
                    </div>
                </div>
                <div class="genres-body"></div>
                <!-- ПК: выбранное внизу окна — чипами, крестик снимает -->
                <div class="genres-deskfoot desk-only"><span class="genres-picked-foot"></span></div>
                <!-- Нижняя панель действий — как в окнах коллекций (templates/collections/win.*.tpl) -->
                <div class="win-actions-wrapper">
                    <!-- Быстрый переход к разделам окна — переключатель как «Все / Публичные / Приватные»
                         в коллекциях (подсветка едет пружиной). Пункты собирает win.genres.js -->
                    <nav class="win-jumps" aria-label="Разделы фильтра" hidden>
                        <div class="bg-selector">
                            <div class="selector"></div>
                        </div>
                        <div class="jump-items"></div>
                    </nav>
                    <!-- Поиск сложен в кнопку-лупу и разъезжается на всю панель — как в окнах коллекций -->
                    <div class="win-actions">
                        <div class="search-wrapper">
                            <button type="button" class="btn-action a-fill filter-close" aria-label="Закрыть поиск">
                                <svg class="icon" viewBox="0 0 640 640" aria-hidden="true">
                                    <use href="#i-xmark"></use>
                                </svg>
                            </button>
                            <input type="search" class="genres-search-input" placeholder="Найти жанр: «исэкай», «школа»…" autocomplete="off" enterkeyhint="search">
                        </div>
                        <div class="default-wrapper">
                            <button type="button" class="btn-action a-fill filter-action" aria-label="Найти жанр">
                                <svg class="icon" viewBox="0 0 10 10" aria-hidden="true">
                                    <use href="#i-ios-search"></use>
                                </svg>
                            </button>
                            <button type="button" class="btn-action a-fill a-text a-tt genres-reset" hidden>Сбросить</button>
                            <button type="button" class="btn-action a-text a-tt a-primary genres-apply">Готово</button>
                        </div>
                    </div>
                </div>
                <div class="safe-area-actions"></div>
            </span>
        </span>
    </span>
    <footer style="visibility: hidden;">
        <template id="tpl-menu-default">
            <div class="app-menu-context -hide">
                <div class="context-close-area"></div>
                <div class="context-wrapper">
                    <div class="context-controls -hide"></div>
                </div>
            </div>
            <div class="app-menu unselectable">
                <div class="menu-wrapper">
                    <div class="menu-controls">
                        <div class="menu-btn" data-id="index">
                            <svg class="menu-icon" viewBox="0 0 512 512" aria-hidden="true">
                                <use href="#i-home"></use>
                            </svg>
                        </div>
                        <div class="menu-btn" data-id="search">
                            <svg class="menu-icon" viewBox="0 0 512 512" aria-hidden="true">
                                <use href="#i-search"></use>
                            </svg>
                        </div>
                        <div class="menu-btn primary" data-id="play">
                            <svg class="menu-icon" viewBox="0 0 640 640" aria-hidden="true">
                                <use href="#i-play"></use>
                            </svg>
                        </div>
                        <div class="menu-btn" data-id="list">
                            <svg class="menu-icon" viewBox="0 0 512 512" aria-hidden="true">
                                <use href="#i-list"></use>
                            </svg>
                        </div>
                        <div class="menu-btn" data-id="user">
                            <svg class="menu-icon" viewBox="0 0 512 512" aria-hidden="true">
                                <use href="#i-user"></use>
                            </svg>
                        </div>
                    </div>
                </div>
            </div>
        </template>
        <svg xmlns="http://www.w3.org/2000/svg" style="width:0;height:0;overflow:hidden;">
            <defs>
                <linearGradient id="menu-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#51B1FE" />
                    <stop offset="100%" stop-color="#2774DB" />
                </linearGradient>
            </defs>
        </svg>

</body>

</html>
