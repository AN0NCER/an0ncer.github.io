<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="page" content="dubs">
    <title>Tunime - Озвучки</title>
    <link rel="icon" type="image/png" href="/images/icon-web.png" />
    <link rel="preload" as="style" href="/style/css/main.css">
    <link rel="preload" as="style" href="/pages/dubs/styles/css/dubs.css">
    <link rel="stylesheet" href="/style/css/main.css">

<body class="unselectable" data-page="dubs" angle="0">
    <div class="body-wrapper">
        <header>
            <div class="page-controll-wrapper">
                <div class="btn">
                    <svg class="icon" viewBox="0 0 640 640" aria-hidden="true">
                        <use href="#i-angle-left"></use>
                    </svg>
                </div>
                <span class="page-title-wrapper">
                    <span class="page">Студии озвучки</span>
                    <span class="sub">0 студий</span>
                </span>
            </div>
            <div class="page-search-wrapper">
                <div class="icon-wrapper">
                    <svg class="icon" viewBox="0 0 10 10" aria-hidden="true">
                        <use href="#i-ios-search"></use>
                    </svg>
                </div>
                <input type="search" id="studio-search" placeholder="Найти студию" autocomplete="off" enterkeyhint="search">
            </div>
        </header>
        <div class="studios-layout">
            <aside class="side-panel scroll-none" aria-label="Тип и сортировка">
                <div class="side-card kind-side">
                    <span class="side-title">Тип</span>
                    <div class="kind-list" role="group" aria-label="Тип студии"></div>
                </div>
                <div class="side-card">
                    <span class="side-title">Сортировка</span>
                    <div class="sort-list" role="listbox" aria-label="Сортировка студий"></div>
                </div>
            </aside>
            <main class="studios">
                <div class="kind-chips scroll-none" role="group" aria-label="Тип студии"></div>
                <div class="studios-toolbar">
                    <span class="sub studios-count"></span>
                    <button type="button" class="chip sm sort-btn" aria-haspopup="dialog">
                        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                            <use href="#i-sort"></use>
                        </svg>
                        <span class="label">Тайтлы</span>
                    </button>
                </div>
                <div class="studio-list" aria-live="polite"></div>
                <div class="studio-list-sentinel"></div>
            </main>
        </div>
    </div>
    <span class="windowed window-dubs-sort unselectable hide">
        <span class="hide-window"></span>
        <span class="window-content scroll-none hide">
            <span class="content-wrapper">
                <div class="window-bar">
                    <div class="window-title">Сортировка</div>
                    <div class="win-bar-btn window-close" role="button" aria-label="Закрыть">
                        <svg class="icon" viewBox="0 0 640 640" aria-hidden="true">
                            <use href="#i-xmark"></use>
                        </svg>
                    </div>
                </div>
                <div class="sort-list" role="listbox" aria-label="Сортировка студий"></div>
            </span>
        </span>
    </span>
    <template id="tpl-studio">
        <div class="studio">
            <span class="avatar" aria-hidden="true"></span>
            <span class="info">
                <span class="title-line">
                    <span class="name"></span>
                    <span class="tag kind"></span>
                    <span class="tag branches"></span>
                </span>
                <span class="sub meta"></span>
                <span class="sub dim updated"></span>
            </span>
            <span class="metric"></span>
            <button type="button" class="fav-btn" aria-pressed="false" aria-label="Добавить в избранное">
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                    <use href="#i-star"></use>
                </svg>
            </button>
        </div>
    </template>
    <template id="tpl-studio-card">
        <div class="studio-card">
            <div class="card-head">
                <span class="avatar" aria-hidden="true"></span>
                <span class="info">
                    <span class="name"></span>
                    <span class="sub kind-line"></span>
                </span>
            </div>
            <div class="kpis"></div>
            <div class="card-foot">
                <span class="sub updated"></span>
                <button type="button" class="fav-btn -pill" aria-pressed="false" aria-label="Добавить в избранное">
                    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                        <use href="#i-star"></use>
                    </svg>
                    <span class="label">В избранное</span>
                </button>
            </div>
        </div>
    </template>
    <div id="app-menu-host"></div>
    <footer style="visibility: hidden;">
        <template id="tpl-menu-default">
            <div class="app-menu-context -hide">
                <div class="context-close-area"></div>
                <div class="context-wrapper">
                    <div class="context-controls -hide"></div>
                </div>
            </div>
            <div class="app-menu unselectable">
                <div class="menu-wrapper">
                    <div class="menu-controls">
                        <div class="menu-btn" data-id="index">
                            <svg class="menu-icon" viewBox="0 0 512 512" aria-hidden="true">
                                <use href="#i-home"></use>
                            </svg>
                        </div>
                        <div class="menu-btn" data-id="search">
                            <svg class="menu-icon" viewBox="0 0 512 512" aria-hidden="true">
                                <use href="#i-search"></use>
                            </svg>
                        </div>
                        <div class="menu-btn primary" data-id="play">
                            <svg class="menu-icon" viewBox="0 0 640 640" aria-hidden="true">
                                <use href="#i-play"></use>
                            </svg>
                        </div>
                        <div class="menu-btn" data-id="list">
                            <svg class="menu-icon" viewBox="0 0 512 512" aria-hidden="true">
                                <use href="#i-list"></use>
                            </svg>
                        </div>
                        <div class="menu-btn" data-id="user">
                            <svg class="menu-icon" viewBox="0 0 512 512" aria-hidden="true">
                                <use href="#i-user"></use>
                            </svg>
                        </div>
                    </div>
                </div>
            </div>
        </template>
